services:
  backend:
    build: ./backend
    container_name: classconnect-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "5001"
    networks:
      - classconnect-network

  frontend:
    build: ./frontend
    container_name: classconnect-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - classconnect-network

networks:
  classconnect-network:
    driver: bridge
