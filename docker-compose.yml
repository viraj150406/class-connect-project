services:

  backend:
    build: ./backend
    container_name: classconnect-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5001:5001"

  frontend:
    build: ./frontend
    container_name: classconnect-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
