apiVersion: apps/v1
kind: Deployment
metadata:
  name: classconnect-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: classconnect-backend
  template:
    metadata:
      labels:
        app: classconnect-backend
    spec:
      containers:
        - name: backend
          image: classconnect-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5001
          envFrom:
            - secretRef:
                name: classconnect-secret
            - configMapRef:
                name: classconnect-config
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 20
